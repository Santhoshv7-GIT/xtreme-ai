<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="g1" x1="10" y1="10" x2="90" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="45%" stop-color="#7000FF" />
      <stop offset="100%" stop-color="#FF007A" />
    </linearGradient>
    <linearGradient id="g2" x1="90" y1="10" x2="10" y2="90" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFB800" />
      <stop offset="50%" stop-color="#FF3D00" />
      <stop offset="100%" stop-color="#D500F9" />
    </linearGradient>
    <filter id="f1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Tech Background Hexagon -->
  <polygon points="50,4 92,26 92,74 50,96 8,74 8,26" fill="#0C0E14" stroke="#00F0FF" stroke-width="2.5" stroke-opacity="0.35" stroke-linejoin="round" />

  <!-- Main Futuristic X -->
  <g filter="url(#f1)">
    <!-- Wing 1: Fiery Amber to Crimson -->
    <path d="M78 18 L88 28 L32 84 L22 74 Z" fill="url(#g2)" />
    <path d="M84 24 L94 34 L78 50 L68 40 Z" fill="#FFB800" opacity="0.85" />

    <!-- Wing 2: Electric Cyan to Vivid Violet -->
    <path d="M22 28 L32 18 L88 74 L78 84 Z" fill="url(#g1)" />
    <path d="M16 34 L26 24 L42 40 L32 50 Z" fill="#00F0FF" opacity="0.9" />

    <!-- Center High-Energy Power Core -->
    <polygon points="50,38 62,50 50,62 38,50" fill="#FFFFFF" />
    <circle cx="50" cy="50" r="3.5" fill="#00F0FF" />
  </g>
</svg>